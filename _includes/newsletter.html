{%- if site.newsletter.buttondown_username != "" -%}
<aside class="newsletter" aria-labelledby="nl-title">
  <h2 id="nl-title" class="display">Get new posts by email</h2>
  <p>One email when something new goes up — notes on test automation and AI agents. No spam, unsubscribe any time.</p>
  <form action="https://buttondown.com/api/emails/embed-subscribe/{{ site.newsletter.buttondown_username }}" method="post" target="_blank">
    <label class="visually-hidden" for="nl-email">Email address</label>
    <input id="nl-email" type="email" name="email" placeholder="you@example.com" required autocomplete="email">
    <button class="btn btn-accent" type="submit">Subscribe</button>
  </form>
</aside>
{%- endif -%}
