<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if page.noindex %}<meta name="robots" content="noindex">{% endif %}
  {% seo %}
  {% feed_meta %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112..125,500;112..125,800&family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body class="page-{{ page.page_class | default: 'default' }}">
  <a class="skip" href="#content">Skip to content</a>
  <div class="wrap">
    <nav class="nav" aria-label="Main">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title | upcase }}</a>
      <div class="nav-links">
        <a href="{{ '/#work' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Work</a>
        <a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog/' %}aria-current="page"{% endif %}>Blog</a>
        {% if site.resume_url != "" %}<a class="pill-dark" href="{{ site.resume_url | relative_url }}">Résumé ↓</a>{% endif %}
      </div>
    </nav>
  </div>

  <div id="content">
    {{ content }}
  </div>

  <footer class="footer">
    <div class="wrap footer-row">
      <div class="footer-links">
        <a href="https://github.com/{{ site.social.github }}">GitHub</a>
        <a href="https://www.linkedin.com/in/{{ site.social.linkedin }}/">LinkedIn</a>
        <a href="https://{{ site.social.medium }}.medium.com/">Medium</a>
        <a href="https://twitter.com/{{ site.social.twitter }}">Twitter / X</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </div>
      <span class="muted">© {{ 'now' | date: '%Y' }} {{ site.author }}</span>
    </div>
  </footer>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
